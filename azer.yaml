# Azer note types — edit this file to add, change, or remove note types.
# Each entry needs a kebab-case `id`. Everything else is optional:
#   label   human name for the "New X" command   (default: Title-Cased id)
#   folder  default folder for new notes          (default: the id)
#   fields  frontmatter keys stamped on new notes; add `list: true` for a
#           list-valued field (default value []) instead of a string ("")
#   body    starter Markdown body
# Changes take effect after you reload Obsidian (or toggle the plugin off/on).

- id: npc
  label: NPC
  folder: NPCs
  fields:
    - key: role
    - key: species
    - key: location
    - key: dndb_stats
  body: |
    ## Appearance

    ## Character Details

    ## Motivations

    ## Secrets

    ## Items

    ## Connections

    ## Backlinks

    ```base
    filters:
      and:
        - file.hasLink(this.file)
    formulas:
      info: role + summary
      Azer_Type: note["azer-type"]
    views:
      - type: table
        name: Backlinks
        groupBy:
          property: formula.Azer_Type
          direction: DESC
        order:
          - file.name
          - formula.info
          - file.mtime
        sort:
          - property: formula.info
            direction: DESC
    ```

- id: session
  label: Session
  folder: Sessions
  fields:
    - key: date
    - key: npcs
      list: true
    - key: locations
      list: true
  body: |
    ## Overview

    ## Beats

    ## Encounters

    | Name | Intro | Experience | DnD Beyond Link |
    | --- | --- | --- | --- |
    |  |  |  |  |

    ## For the DM

    ## Follow Up

    ## Log

